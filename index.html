<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lucy Liquid Sort — Web</title>
<style>
  html,body { height:100%; margin:0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
    color: #e8eefc;
    background: #0b1020 no-repeat center center fixed;
    background-size: cover;
    transition: background-image 1s ease-in-out;
  }
  .wrap { width:min(1000px,96vw); padding:16px; margin:auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  button { border:1px solid #33406a; background:#1a2446; color:#e8eefc; padding:8px 12px; border-radius:8px; cursor:pointer; }
  canvas { width:100%; height:auto; background:transparent; border:1px solid #243059; border-radius:12px; }
  footer { margin-top:8px; font-size:12px; color:#93a0c2; text-align:center; }
  /* 효과 */
  .fade { animation: fadeEffect 1.2s; }
  .zoom { animation: zoomEffect 1.2s; }
  .slide { animation: slideEffect 1.2s; }
  .rotate { animation: rotateEffect 1.2s; }
  .blur { animation: blurEffect 1.2s; }
  @keyframes fadeEffect { from {opacity:0;} to {opacity:1;} }
  @keyframes zoomEffect { from {transform:scale(1.2);} to {transform:scale(1);} }
  @keyframes slideEffect { from {background-position:-100% 0;} to {background-position:center;} }
  @keyframes rotateEffect { from {transform:rotate(10deg);} to {transform:rotate(0);} }
  @keyframes blurEffect { from {filter:blur(12px);} to {filter:blur(0);} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Lucy Liquid Sort</h1>
      <div><span id="levelLabel">Level 1</span> • <span id="moves">0 moves</span></div>
      <div>
        <button id="btnUndo">Undo</button>
        <button id="btnReset">Reset</button>
        <button id="btnNew">New</button>
      </div>
    </header>
    <canvas id="game" width="1200" height="700"></canvas>
    <footer>Tap a tube, then another to pour. Undo available.</footer>
  </div>

<script>
/* Lucy 배경 */
const backgrounds = [
  "lucy1.png","lucy2.png","lucy3.png","lucy4.png","lucy5.png",
  "lucy6.png","lucy7.png","lucy8.png","lucy9.png","lucy10.png"
];
const effects = ["fade","zoom","slide","rotate","blur"];
let current = 0, changeCount = 0;

function swapBg(){
  document.body.style.backgroundImage = `url(${backgrounds[current]})`;
  current = (current+1)%backgrounds.length;
  changeCount++;
  if(changeCount % 10 === 0){
    const fx = effects[Math.floor(Math.random()*effects.length)];
    document.body.classList.add(fx);
    setTimeout(()=>document.body.classList.remove(fx),1200);
  }
}
swapBg();
setInterval(swapBg,60000);
</script>

<script>
/* 퍼즐 게임 로직 (간단히 그대로) */
const TUBE_CAPACITY=4, BASE_TUBES=6, EMPTY_TUBES=2;
const COLORS=['#ff5964','#f2a65a','#ffe74c','#59cd90','#4d9de0','#b57edc','#ff87ab','#7cf5ff'];
let level=1,tubes=[],history=[],selected=null,moves=0;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const uiLevel=document.getElementById('levelLabel'),uiMoves=document.getElementById('moves');

document.getElementById('btnUndo').onclick=()=>{if(history.length){tubes=history.pop();moves--;uiMoves.textContent=moves+' moves';selected=null;draw();}};
document.getElementById('btnReset').onclick=()=>loadLevel(level,true);
document.getElementById('btnNew').onclick=()=>{level++;loadLevel(level);};
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*(canvas.width/r.width),y=(e.clientY-r.top)*(canvas.height/r.height);const i=tubes.findIndex(t=>x>=t._rect.x&&x<=t._rect.x+t._rect.w&&y>=t._rect.y&&y<=t._rect.y+t._rect.h);if(i<0)return;if(selected==null){selected=i;draw();return;}if(selected===i){selected=null;draw();return;}pour(selected,i);});

function randInt(n){return Math.floor(Math.random()*n);}
function generateLevel(n){const sets=Math.min(3+Math.floor((n-1)/1.5),8);const cnt=Math.max(BASE_TUBES,sets+EMPTY_TUBES);let arr=[];for(let c=0;c<sets;c++)for(let s=0;s<TUBE_CAPACITY;s++)arr.push(c);for(let i=arr.length-1;i>0;i--){let j=randInt(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}const piles=Array.from({length:cnt},()=>[]);let k=0;for(let t=0;t<cnt-EMPTY_TUBES;t++)for(let s=0;s<TUBE_CAPACITY;s++)piles[t].push(arr[k++]);return piles;}
function clone(st){return st.map(t=>t.slice());}
function loadLevel(n,keep=false){if(!keep)level=n;tubes=generateLevel(level);history=[];selected=null;moves=0;uiLevel.textContent='Level '+level;uiMoves.textContent=moves+' moves';draw();}
function legalMove(a,b){if(a===b)return false;let A=tubes[a],B=tubes[b];if(!A.length||B.length===TUBE_CAPACITY)return false;let color=A[A.length-1],count=1;for(let i=A.length-2;i>=0&&A[i]===color;i--)count++;if(!B.length)return true;return B[B.length-1]===color&&B.length+Math.min(count,TUBE_CAPACITY-B.length)<=TUBE_CAPACITY;}
function pour(a,b){if(!legalMove(a,b))return;history.push(clone(tubes));let A=tubes[a],B=tubes[b],color=A[A.length-1];while(A.length&&A[A.length-1]===color&&B.length<TUBE_CAPACITY)B.push(A.pop());moves++;uiMoves.textContent=moves+' moves';selected=null;draw();}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const cols=Math.min(tubes.length,8),gap=28,tubeW=Math.min(90,(canvas.width-gap*(cols+1))/cols),tubeH=340,baseY=canvas.height-90,startX=(canvas.width-(tubeW*cols+gap*(cols-1)))/2;tubes.forEach((tube,i)=>{const x=startX+i*(tubeW+gap),y=baseY-tubeH;ctx.lineWidth=3;ctx.strokeStyle='#3a4878';ctx.strokeRect(x,y,tubeW,tubeH);tube._rect={x,y,w:tubeW,h:tubeH};const segH=(tubeH-16)/TUBE_CAPACITY;for(let s=0;s<tube.length;s++){ctx.fillStyle=COLORS[tube[s]%COLORS.length];ctx.fillRect(x+4,y+tubeH-(s+1)*segH-8,tubeW-8,segH-6);}});}
loadLevel(1);
</script>
</body>
</html>

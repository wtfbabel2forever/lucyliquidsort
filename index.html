<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucy Liquid Sort — Final Build</title>
<style>
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
    background:#0b1020 no-repeat center center fixed;
    background-size:cover;
    color:#e8eefc;
    transition:background-image 1s ease-in-out;
  }
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  h1{font-size:18px;margin:0}
  .hud{font-size:14px;color:#9fb2da}
  button{border:1px solid #33406a;background:#1a2446;color:#e8eefc;padding:8px 10px;border-radius:10px;cursor:pointer}
  button:hover{background:#23305a}
  canvas{width:100%;height:auto;background:transparent;border:1px solid #243059;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.45)}
  footer{margin-top:8px;font-size:12px;color:#93a0c2;text-align:center}
  .fade { animation: fadeEffect 1s; }
  .zoom { animation: zoomEffect 1s; }
  .slide { animation: slideEffect 1s; }
  .rotate { animation: rotateEffect 1s; }
  .blur { animation: blurEffect 1s; }
  @keyframes fadeEffect { from{opacity:0} to{opacity:1} }
  @keyframes zoomEffect { from{transform:scale(1.2)} to{transform:scale(1)} }
  @keyframes slideEffect { from{background-position:-100% 0} to{background-position:center} }
  @keyframes rotateEffect { from{transform:rotate(10deg)} to{transform:rotate(0)} }
  @keyframes blurEffect { from{filter:blur(12px)} to{filter:blur(0)} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Lucy Liquid Sort</h1>
      <div class="hud"><span id="levelLabel">Level 1</span> • <span id="moves">0</span> moves</div>
      <div>
        <button id="btnUndo">Undo</button>
        <button id="btnReset">Reset</button>
        <button id="btnNew">New</button>
      </div>
    </header>
    <canvas id="game" width="1000" height="560"></canvas>
    <footer>Tap a tube, then tap a target tube to pour. Undo available.</footer>
  </div>

<script>
/* Lucy 배경 (1분마다 교체, 10번째마다 효과) */
const backgrounds = [
  "lucy1.png","lucy2.png","lucy3.png","lucy4.png","lucy5.png",
  "lucy6.png","lucy7.png","lucy8.png","lucy9.png","lucy10.png"
];
const effects = ["fade","zoom","slide","rotate","blur"];
let current = 0, changeCount = 0;
function swapBg(){
  document.body.style.backgroundImage = `url(${backgrounds[current]})`;
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center center";
  current = (current+1)%backgrounds.length;
  changeCount++;
  if(changeCount % 10 === 0){
    const fx = effects[Math.floor(Math.random()*effects.length)];
    document.body.classList.add(fx);
    setTimeout(()=>document.body.classList.remove(fx),1000);
  }
}
swapBg();
setInterval(swapBg,60000);
</script>

<script>
/* 퍼즐 게임 로직 (수정 완료판) */
const TUBE_CAPACITY=4, BASE_TUBES=6, EMPTY_TUBES=2;
const COLORS=['#ff5964','#f2a65a','#ffe74c','#59cd90','#4d9de0','#b57edc','#ff87ab','#7cf5ff'];

let level=1,tubes=[],history=[],selected=null,moves=0;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const uiLevel=document.getElementById('levelLabel'),uiMoves=document.getElementById('moves');

document.getElementById('btnUndo').onclick=()=>undo();
document.getElementById('btnReset').onclick=()=>loadLevel(level,true);
document.getElementById('btnNew').onclick=()=>{level++;loadLevel(level);};

canvas.addEventListener('click',e=>handleClick(e.clientX,e.clientY));
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];handleClick(t.clientX,t.clientY);},{passive:false});

function randInt(n){return Math.floor(Math.random()*n);}
function generateLevel(n){
  const sets=Math.min(3+Math.floor((n-1)/1.5),8);
  const cnt=Math.max(BASE_TUBES,sets+EMPTY_TUBES);
  let arr=[]; for(let c=0;c<sets;c++) for(let s=0;s<TUBE_CAPACITY;s++) arr.push(c);
  for(let i=arr.length-1;i>0;i--){let j=randInt(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
  const piles=Array.from({length:cnt},()=>[]); let k=0;
  for(let t=0;t<cnt-EMPTY_TUBES;t++) for(let s=0;s<TUBE_CAPACITY;s++) piles[t].push(arr[k++]);
  return piles;
}
function clone(st){return st.map(t=>t.slice());}
function loadLevel(n,keep=false){
  if(!keep) level=n;
  tubes=generateLevel(level); history=[]; selected=null; moves=0;
  uiLevel.textContent='Level '+level; uiMoves.textContent='0'; draw();
}
function legalMove(a,b){
  if(a===b) return false;
  const A=tubes[a],B=tubes[b];
  if(A.length===0 || B.length===TUBE_CAPACITY) return false;
  const color=A[A.length-1];
  let count=1; for(let i=A.length-2;i>=0&&A[i]===color;i--) count++;
  if(B.length===0) return true;
  return B[B.length-1]===color && B.length+Math.min(count,TUBE_CAPACITY-B.length)<=TUBE_CAPACITY;
}
function pour(a,b){
  if(!legalMove(a,b)) return;
  history.push(clone(tubes)); // 상태 저장
  const A=tubes[a],B=tubes[b]; const color=A[A.length-1];
  while(A.length && A[A.length-1]===color && B.length<TUBE_CAPACITY){B.push(A.pop());}
  moves++; uiMoves.textContent=moves; selected=null; draw();
  checkWin();
}
function undo(){
  if(history.length){ tubes=history.pop(); moves=Math.max(0,moves-1); uiMoves.textContent=moves; selected=null; draw(); }
}
function handleClick(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  const x=(clientX-r.left)*(canvas.width/r.width);
  const y=(clientY-r.top)*(canvas.height/r.height);
  const i=tubes.findIndex(t=>x>=t._rect.x&&x<=t._rect.x+t._rect.w&&y>=t._rect.y&&y<=t._rect.y+t._rect.h);
  if(i<0) return;
  if(selected==null){
    if(tubes[i].length>0){selected=i; draw();}
    return;
  }
  if(selected===i){selected=null; draw(); return;}
  pour(selected,i);
}
function checkWin(){
  for(const tube of tubes){
    if(tube.length===0) continue;
    const first=tube[0];
    for(const c of tube){ if(c!==first) return false; }
    if(tube.length!==TUBE_CAPACITY) return false;
  }
  setTimeout(()=>{
    alert(`You won level ${level} in ${moves} moves!`);
    level++; loadLevel(level);
  },300);
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cols=Math.min(tubes.length,8),gap=26,tubeW=Math.min(90,(canvas.width-gap*(cols+1))/cols),
        tubeH=320,baseY=canvas.height-70,startX=(canvas.width-(tubeW*cols+gap*(cols-1)))/2;
  tubes.forEach((tube,i)=>{
    const x=startX+i*(tubeW+gap),y=baseY-tubeH;
    ctx.lineWidth=3; ctx.strokeStyle='#3a4878'; ctx.fillStyle='rgba(255,255,255,0.04)';
    roundRect(ctx,x,y,tubeW,tubeH,16,true,true);
    if(selected===i) glow(ctx,x,y,tubeW,tubeH);
    const segH=(tubeH-16)/TUBE_CAPACITY;
    for(let s=0;s<tube.length;s++){
      const c=COLORS[tube[s]%COLORS.length]; const segY=y+tubeH-(s+1)*segH-8;
      drawSeg(ctx,x+8,segY,tubeW-16,segH-6,c);
    }
    tube._rect={x,y,w:tubeW,h:tubeH};
  });
}
function roundRect(ctx,x,y,w,h,r,fill,stroke){
  if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
  ctx.beginPath();
  ctx.moveTo(x+r.tl,y); ctx.lineTo(x+w-r.tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);
  ctx.lineTo(x+w,y+h-r.br); ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
  ctx.lineTo(x+r.bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl);
  ctx.lineTo(x,y+r.tl); ctx.quadraticCurveTo(x,y,x+r.tl,y);
  ctx.closePath();
  if(fill) ctx.fill(); if(stroke) ctx.stroke();
}
function drawSeg(ctx,x,y,w,h,color){
  const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,shade(color,20)); g.addColorStop(1,shade(color,-10));
  ctx.fillStyle=g; ctx.strokeStyle=shade(color,-35); ctx.lineWidth=2; roundRect(ctx,x,y,w,h,10,true,true);
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+amt));
  g=Math.max(0,Math.min(255,g+amt));
  b=Math.max(0,Math.min(255,b+amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function glow(ctx,x,y,w,h){
  ctx.save(); ctx.shadowBlur=18; ctx.shadowColor='rgba(124,245,255,.85)';
  ctx.strokeStyle='rgba(124,245,255,.9)'; ctx.lineWidth=3;
  roundRect(ctx,x-2,y-2,w+4,h+4,20,false,true); ctx.restore();
}
loadLevel(1);
</script>
</body>
</html>

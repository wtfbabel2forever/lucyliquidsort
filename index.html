<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lucy Liquid Sort — 3D Mode</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
      color: #e8eefc;
      background: #0b1020 no-repeat center center fixed;
      background-size: cover;
    }
    #bg { position: fixed; inset: 0; pointer-events:none; z-index:0; }
    .ui { position: absolute; top: 10px; left: 10px; z-index: 10; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 10px; }
    button { margin: 5px; padding: 8px 12px; border: 1px solid #33406a; background: #1a2446; color: #e8eefc; border-radius: 10px; cursor: pointer; }
    button:hover { background: #212d58; }
    #debug {
      position: fixed; right: 10px; top: 10px; z-index: 9999;
      background: rgba(0,0,0,.6); color: #fff; padding:8px 10px; border-radius:10px;
      font-size: 12px; line-height: 1.4; max-width: 60vw;
    }
  </style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="debug">Loading...</div>

  <div class="ui">
    <h2>Lucy Liquid Sort</h2>
    <div><span id="levelLabel">Level 1</span> • <span id="moves">0</span> moves</div>
    <button id="btnUndo">Undo</button>
    <button id="btnReset">Reset</button>
    <button id="btnNew">New</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // ========== Debug helpers ==========
    const $debug = document.getElementById('debug');
    function logDebug(msg, cls='') {
      if(!$debug) return;
      const p = document.createElement('div');
      if(cls) p.className = cls;
      p.textContent = msg;
      $debug.appendChild(p);
    }
    function setDebug(msg) { $debug.textContent = msg; }
    function closeDebug(){ if($debug) $debug.remove(); }

    // ========== Lucy Background (robust) ==========
    (function(){
      const list = [
        "lucy1.png","lucy2.png","lucy3.png","lucy4.png","lucy5.png",
        "lucy6.png","lucy7.png","lucy8.png","lucy9.png","lucy10.png"
      ];
      const effects = ["fade","zoom","slide","rotate","blur"];
      const available = [];
      let tested = 0, current = 0, changeCount = 0;
      const bgDiv = document.getElementById('bg');

      function probe(src, cb){
        const img = new Image();
        img.onload = ()=>cb(src,true);
        img.onerror = ()=>cb(src,false);
        img.src = src + "?v=" + Date.now();
      }

      setDebug("Checking Lucy images in root…");
      list.forEach(src => probe(src, (s, ok)=>{
        tested++;
        if(ok){ available.push(s); logDebug("✓ found "+s, 'ok'); }
        else { logDebug("✗ missing "+s, 'err'); }
        if(tested===list.length){
          if(available.length===0){
            logDebug("No lucy*.png images found next to index.html", 'err');
            initGame();
          } else {
            logDebug("Loaded "+available.length+" / "+list.length+" images.", 'ok');
            swap();
            setInterval(swap, 60000);
            initGame();
          }
          const x = document.createElement('span');
          x.textContent = '✕';
          x.className = 'close';
          x.onclick = closeDebug;
          $debug.appendChild(x);
        }
      }));

      function applyBg(url){
        document.body.style.backgroundImage = 'url("'+url+'")';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center center';
      }

      function swap(){
        if(!available.length) return;
        applyBg(available[current]);
        current = (current + 1) % available.length;
        changeCount++;
        if(changeCount % 10 === 0){
          const fx = effects[Math.floor(Math.random()*effects.length)];
          document.body.classList.add(fx);
          setTimeout(()=>document.body.classList.remove(fx), 1000);
        }
      }
    })();
  </script>

  <script>
    // ========== 3D Game with Three.js ==========
    (function(){
      const TUBE_CAPACITY=4, BASE_TUBES=6, EMPTY_TUBES=2;
      const COLORS=['#ff5964','#f2a65a','#ffe74c','#59cd90','#4d9de0','#b57edc','#ff87ab','#7cf5ff'];

      let level=1,tubes=[],history=[],selected=null,moves=0;
      const uiLevel=document.getElementById('levelLabel'),uiMoves=document.getElementById('moves');

      // Three.js setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x0b1020);
      document.body.appendChild(renderer.domElement);

      // Add lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(0, 10, 10);
      scene.add(directionalLight);

      // Camera position
      camera.position.set(0, 0, 15);
      camera.lookAt(0, 0, 0);

      // Controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Game objects
      const tubeObjects = [];

      function initGame() {
        loadLevel(level);
        animate();
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      document.getElementById('btnUndo').onclick=()=>{ if(history.length){ tubes=history.pop(); moves=Math.max(0,moves-1); uiMoves.textContent=moves; selected=null; draw3D(); } };
      document.getElementById('btnReset').onclick=()=>loadLevel(level,true);
      document.getElementById('btnNew').onclick=()=>{ level++; loadLevel(level); };

      // Click detection for 3D objects
      renderer.domElement.addEventListener('click', (event) => {
        const mouse = new THREE.Vector2();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(tubeObjects);
        if (intersects.length > 0) {
          const clickedTubeIndex = tubeObjects.indexOf(intersects[0].object.parent);
          if(selected==null){ 
            if(tubes[clickedTubeIndex].length > 0) {
              selected=clickedTubeIndex; 
              draw3D(); 
            }
            return; 
          }
          if(selected===clickedTubeIndex){ selected=null; draw3D(); return; }
          pour(selected,clickedTubeIndex);
        }
      });

      function randInt(n){return Math.floor(Math.random()*n);}
      function generateLevel(n){
        const sets=Math.min(3+Math.floor((n-1)/1.5),8);
        const cnt=Math.max(BASE_TUBES,sets+EMPTY_TUBES);
        let arr=[]; 
        for(let c=0;c<sets;c++) 
          for(let s=0;s<TUBE_CAPACITY;s++) 
            arr.push(c);
        
        for(let i=arr.length-1;i>0;i--){
          let j=randInt(i+1); 
          [arr[i],arr[j]]=[arr[j],arr[i]]; 
        }
        
        const piles=Array.from({length:cnt},()=>[]);
        let k=0;
        for(let t=0;t<cnt;t++) { 
          for(let s=0;s<TUBE_CAPACITY;s++) {
            if(k < arr.length) {
              piles[t].push(arr[k++]);
            }
          }
        }
        
        return piles;
      }
      function clone(st){return st.map(t=>t.slice());}
      function loadLevel(n,keep=false){
        if(!keep) level=n;
        tubes=generateLevel(level); 
        history=[]; 
        selected=null; 
        moves=0;
        uiLevel.textContent='Level '+level; 
        uiMoves.textContent=moves; 
        draw3D();
      }
      function legalMove(a,b){
        if(a===b) return false;
        let A=tubes[a],B=tubes[b];
        if(A.length === 0 || B.length===TUBE_CAPACITY) return false;
        let color=A[A.length-1],count=1;
        for(let i=A.length-2;i>=0&&A[i]===color;i--) count++;
        if(B.length === 0) return true;
        return B[B.length-1]===color && B.length + Math.min(count, TUBE_CAPACITY-B.length) <= TUBE_CAPACITY;
      }
      function pour(a,b){
        if(!legalMove(a,b)) return;
        history.push(clone(tubes));
        let A=tubes[a],B=tubes[b],color=A[A.length-1];
        while(A.length && A[A.length-1]===color && B.length<TUBE_CAPACITY) B.push(A.pop());
        moves++; uiMoves.textContent=moves; selected=null; draw3D();
        checkWin();
      }
      function checkWin() {
        for(const tube of tubes) {
          if(tube.length === 0) continue;
          const firstColor = tube[0];
          for(const color of tube) {
            if(color !== firstColor) return false;
          }
          if(tube.length !== TUBE_CAPACITY) return false;
        }
        setTimeout(() => {
          alert(`You won level ${level} in ${moves} moves!`);
          level++;
          loadLevel(level);
        }, 300);
      }

      function draw3D() {
        // Clear existing tubes
        tubeObjects.forEach(obj => scene.remove(obj));
        tubeObjects.length = 0;

        // Create new tubes
        const cols = Math.min(tubes.length, 8);
        const gap = 2.5;
        const tubeRadius = 0.8;
        const tubeHeight = 4;
        const startX = -(cols - 1) * (tubeRadius * 2 + gap) / 2;

        tubes.forEach((tube, i) => {
          const group = new THREE.Group();
          
          // Tube shell (cylinder)
          const tubeGeometry = new THREE.CylinderGeometry(tubeRadius, tubeRadius, tubeHeight, 32);
          const tubeMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
            metalness: 0.5,
            roughness: 0.5
          });
          const tubeMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
          tubeMesh.rotation.x = Math.PI / 2; // Rotate to stand upright
          group.add(tubeMesh);
          
          // Tube cap (top)
          const capGeometry = new THREE.CircleGeometry(tubeRadius, 32);
          const capMaterial = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            metalness: 0.8,
            roughness: 0.2
          });
          const capMesh = new THREE.Mesh(capGeometry, capMaterial);
          capMesh.rotation.x = Math.PI / 2;
          capMesh.position.y = tubeHeight / 2;
          group.add(capMesh);
          
          // Liquid segments
          const segHeight = tubeHeight / TUBE_CAPACITY;
          for(let s=0; s<tube.length; s++){
            const colorIndex = tube[s] % COLORS.length;
            const liquidColor = parseInt(COLORS[colorIndex].replace('#',''), 16);
            
            // Liquid geometry
            const liquidGeometry = new THREE.CylinderGeometry(tubeRadius * 0.95, tubeRadius * 0.95, segHeight * 0.9, 32);
            const liquidMaterial = new THREE.MeshStandardMaterial({
              color: liquidColor,
              transparent: true,
              opacity: 0.8,
              metalness: 0.2,
              roughness: 0.8
            });
            const liquidMesh = new THREE.Mesh(liquidGeometry, liquidMaterial);
            liquidMesh.rotation.x = Math.PI / 2;
            liquidMesh.position.y = -tubeHeight/2 + segHeight/2 + s * segHeight;
            group.add(liquidMesh);
          }
          
          // Position tube
          group.position.x = startX + i * (tubeRadius * 2 + gap);
          group.position.y = 0;
          group.position.z = 0;
          
          // Store tube data
          group.userData = { index: i };
          tubeObjects.push(group);
          scene.add(group);
        });
      }

      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Initialize game
      initGame();
    })();
  </script>
</body>
</html>
